<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AllSub — Connexion</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --surface: #f0f9ff;
            --surface-container: #e6eeff;
            --surface-container-low: #eff4ff;
            --surface-container-lowest: #ffffff;
            --surface-container-high: #dee9fc;
            --on-surface: #121c2a;
            --on-surface-variant: #434655;
            --outline: #737686;
            --outline-variant: #c3c6d7;

            --primary: #004ac6;
            --primary-container: #2563eb;
            --secondary: #0058be;
            --on-primary: #ffffff;

            --error: #ba1a1a;
            --error-container: #ffdad6;
            --on-error-container: #93000a;

            --radius-lg: 0.5rem;
            --radius-xl: 0.75rem;
            --radius-2xl: 1rem;

            --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 20px 60px rgba(37, 99, 235, 0.15);

            --font: 'Inter', 'Segoe UI', system-ui, sans-serif;
        }

        body {
            font-family: var(--font);
            background: linear-gradient(135deg, #f0f9ff 0%, #ffffff 100%);
            color: var(--on-surface);
            font-size: 14px;
            line-height: 20px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            -webkit-font-smoothing: antialiased;
            position: relative;
            overflow: hidden;
        }

        /* Cercles décoratifs flous */
        body::before,
        body::after {
            content: "";
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            pointer-events: none;
            z-index: 0;
        }

        body::before {
            width: 400px;
            height: 400px;
            background: rgba(37, 99, 235, 0.12);
            top: -100px;
            left: -100px;
        }

        body::after {
            width: 350px;
            height: 350px;
            background: rgba(0, 74, 198, 0.1);
            bottom: -80px;
            right: -80px;
        }

        a { text-decoration: none; color: inherit; }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            font-size: 20px;
            vertical-align: middle;
        }

        /* ============================================================
           CARTE DE CONNEXION
           ============================================================ */
        .login-wrapper {
            width: 100%;
            max-width: 440px;
            position: relative;
            z-index: 1;
        }

        .login-card {
            background: var(--surface-container-lowest);
            border-radius: var(--radius-2xl);
            padding: 44px 36px;
            box-shadow: var(--shadow-lg);
            animation: fadeInUp 0.5s ease;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* Logo */
        .login-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .logo-block {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
        }

        .logo-icon {
            width: 44px;
            height: 44px;
            background: linear-gradient(135deg, var(--primary), var(--primary-container));
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--on-primary);
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
        }

        .logo-icon .material-symbols-outlined {
            font-size: 24px;
            font-variation-settings: 'FILL' 1;
        }

        .logo-name {
            font-size: 26px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary), var(--primary-container));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.5px;
        }

        .login-subtitle {
            font-size: 13px;
            color: var(--on-surface-variant);
            margin-top: 4px;
        }

        /* Titre */
        .login-title-block {
            margin-bottom: 24px;
            text-align: center;
        }

        .login-title-block h1 {
            font-size: 22px;
            font-weight: 700;
            color: var(--on-surface);
            margin-bottom: 4px;
            letter-spacing: -0.3px;
        }

        .login-title-block p {
            font-size: 13px;
            color: var(--on-surface-variant);
        }

        /* ============================================================
           FORMULAIRE
           ============================================================ */
        .form-group {
            margin-bottom: 16px;
        }

        .form-label-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .form-label {
            font-size: 12px;
            font-weight: 600;
            color: var(--on-surface);
        }

        .form-link {
            font-size: 12px;
            color: var(--primary);
            font-weight: 500;
        }

        .form-link:hover { text-decoration: underline; }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-icon {
            position: absolute;
            left: 14px;
            color: var(--outline);
            font-size: 18px;
            pointer-events: none;
            transition: color 0.15s;
        }

        .form-input {
            width: 100%;
            height: 46px;
            padding: 0 44px 0 42px;
            background: var(--surface-container-low);
            border: 2px solid transparent;
            border-radius: 10px;
            font-family: var(--font);
            font-size: 14px;
            color: var(--on-surface);
            outline: none;
            transition: border 0.15s, background 0.15s, box-shadow 0.15s;
        }

        .form-input:focus {
            border-color: var(--primary);
            background: var(--surface-container-lowest);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .form-input:focus ~ .input-icon {
            color: var(--primary);
        }

        .form-input::placeholder { color: var(--outline); }

        /* Bouton œil */
        .toggle-password {
            position: absolute;
            right: 10px;
            width: 32px;
            height: 32px;
            border: none;
            background: transparent;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--outline);
            transition: background 0.15s, color 0.15s;
        }

        .toggle-password:hover {
            background: var(--surface-container-high);
            color: var(--primary);
        }

        /* Checkbox se souvenir */
        .remember-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 8px 0 24px;
        }

        .remember-label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: var(--on-surface-variant);
            cursor: pointer;
            user-select: none;
        }

        .remember-label input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: var(--primary);
            cursor: pointer;
        }

        /* Bouton principal */
        .btn-login {
            width: 100%;
            height: 48px;
            background: var(--primary);
            color: var(--on-primary);
            border: none;
            border-radius: 10px;
            font-family: var(--font);
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: background 0.15s, transform 0.1s, box-shadow 0.15s;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
            margin-bottom: 20px;
        }

        .btn-login:hover:not(:disabled) {
            background: var(--secondary);
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(37, 99, 235, 0.35);
        }

        .btn-login:active:not(:disabled) {
            transform: translateY(0);
        }

        .btn-login:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .spinner {
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: none;
        }

        .btn-login.loading .spinner { display: block; }
        .btn-login.loading .btn-text { opacity: 0.8; }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Séparateur */
        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 20px 0;
        }

        .divider::before,
        .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: var(--outline-variant);
        }

        .divider span {
            font-size: 11px;
            color: var(--outline);
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Lien espace client */
        .btn-client {
            width: 100%;
            height: 44px;
            background: var(--surface-container-low);
            color: var(--primary);
            border: 1px solid var(--outline-variant);
            border-radius: 10px;
            font-family: var(--font);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: background 0.15s;
        }

        .btn-client:hover {
            background: var(--surface-container-high);
        }

        /* Badge SSL */
        .ssl-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            background: var(--surface-container-low);
            border-radius: 20px;
            font-size: 11px;
            color: var(--on-surface-variant);
            margin: 20px auto 0;
            justify-content: center;
            width: fit-content;
        }

        .ssl-badge .material-symbols-outlined {
            font-size: 14px;
            color: var(--primary);
            font-variation-settings: 'FILL' 1;
        }

        /* Support */
        .support-line {
            text-align: center;
            margin-top: 18px;
            font-size: 12px;
            color: var(--outline);
        }

        .support-line a {
            color: var(--primary);
            font-weight: 500;
        }

        .support-line a:hover { text-decoration: underline; }

        /* ============================================================
           MESSAGE D'ERREUR
           ============================================================ */
        .error-banner {
            display: none;
            background: var(--error-container);
            color: var(--on-error-container);
            padding: 12px 14px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 16px;
            align-items: center;
            gap: 8px;
        }

        .error-banner.show {
            display: flex;
            animation: shake 0.4s ease;
        }

        .error-banner .material-symbols-outlined {
            font-size: 18px;
            flex-shrink: 0;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-6px); }
            75% { transform: translateX(6px); }
        }

        /* ============================================================
           FOOTER
           ============================================================ */
        .login-footer {
            text-align: center;
            margin-top: 24px;
            font-size: 11px;
            color: var(--outline);
        }

        /* ============================================================
           RESPONSIVE
           ============================================================ */
        @media (max-width: 480px) {
            .login-card {
                padding: 32px 24px;
            }
            .login-title-block h1 { font-size: 20px; }
            .logo-name { font-size: 22px; }
            .form-input { height: 44px; font-size: 16px; }
        }
    </style>
</head>
<body>

<div class="login-wrapper">
    <div class="login-card">

        <!-- ===== LOGO ===== -->
        <div class="login-header">
            <div class="logo-block">
                <div class="logo-icon">
                    <span class="material-symbols-outlined">bolt</span>
                </div>
                <span class="logo-name">AllSub</span>
            </div>
            <p class="login-subtitle">par AllSolutions</p>
        </div>

        <!-- ===== TITRE ===== -->
        <div class="login-title-block">
            <h1>Connexion</h1>
            <p>Accédez à votre espace agent</p>
        </div>

        <!-- ===== BANNIÈRE ERREUR ===== -->
        <div class="error-banner" id="errorBanner">
            <span class="material-symbols-outlined">error</span>
            <span id="errorMessage">Email ou mot de passe incorrect</span>
        </div>

        <!-- ===== FORMULAIRE ===== -->
        <form id="loginForm" novalidate>

            <!-- Email -->
            <div class="form-group">
                <div class="form-label-row">
                    <label class="form-label" for="email">Adresse email</label>
                </div>
                <div class="input-wrapper">
                    <span class="material-symbols-outlined input-icon">mail</span>
                    <input
                        type="email"
                        class="form-input"
                        id="email"
                        placeholder="agent@allsolutions.cd"
                        autocomplete="email"
                        required
                    >
                </div>
            </div>

            <!-- Mot de passe -->
            <div class="form-group">
                <div class="form-label-row">
                    <label class="form-label" for="password">Mot de passe</label>
                    <a href="#" class="form-link">Mot de passe oublié ?</a>
                </div>
                <div class="input-wrapper">
                    <span class="material-symbols-outlined input-icon">lock</span>
                    <input
                        type="password"
                        class="form-input"
                        id="password"
                        placeholder="••••••••"
                        autocomplete="current-password"
                        required
                    >
                    <button type="button" class="toggle-password" id="togglePassword" title="Afficher/masquer">
                        <span class="material-symbols-outlined">visibility</span>
                    </button>
                </div>
            </div>

            <!-- Se souvenir -->
            <div class="remember-row">
                <label class="remember-label">
                    <input type="checkbox" id="remember" checked>
                    Se souvenir de moi
                </label>
            </div>

            <!-- Bouton principal -->
            <button type="submit" class="btn-login" id="submitBtn">
                <span class="spinner"></span>
                <span class="btn-text">Se connecter</span>
                <span class="material-symbols-outlined" style="font-size: 18px;">arrow_forward</span>
            </button>
        </form>

        <!-- Séparateur -->
        <div class="divider">
            <span>ou</span>
        </div>

        <!-- Lien espace client -->
        <button class="btn-client" onclick="window.location.href='espace-client.html'">
            <span class="material-symbols-outlined" style="font-size: 18px;">language</span>
            Accéder à l'Espace Client
        </button>

        <!-- Badge SSL -->
        <div class="ssl-badge">
            <span class="material-symbols-outlined">verified_user</span>
            Chiffrement SSL 256-bit • Serveurs sécurisés
        </div>

        <!-- Support -->
        <div class="support-line">
            Besoin d'aide ? <a href="mailto:support@allsolutions.cd">support@allsolutions.cd</a>
        </div>

    </div>

    <!-- Footer -->
    <div class="login-footer">
        © 2026 AllSolutions — Cohorte 16
    </div>
</div>

<script>
    /* ============================================================
       ÉLÉMENTS
       ============================================================ */
    const form          = document.getElementById('loginForm');
    const emailInput    = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const toggleBtn     = document.getElementById('togglePassword');
    const submitBtn     = document.getElementById('submitBtn');
    const errorBanner   = document.getElementById('errorBanner');
    const errorMessage  = document.getElementById('errorMessage');

    /* ============================================================
       TOGGLE MOT DE PASSE
       ============================================================ */
    toggleBtn.addEventListener('click', () => {
        const icon = toggleBtn.querySelector('.material-symbols-outlined');
        if (passwordInput.type === 'password') {
            passwordInput.type = 'text';
            icon.textContent = 'visibility_off';
        } else {
            passwordInput.type = 'password';
            icon.textContent = 'visibility';
        }
    });

    /* ============================================================
       VALIDATION
       ============================================================ */
    function validateEmail(email) {
        return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
    }

    function showError(message) {
        errorMessage.textContent = message;
        errorBanner.classList.add('show');
        setTimeout(() => {
            errorBanner.classList.remove('show');
        }, 4000);
    }

    /* ============================================================
       SOUMISSION
       ============================================================ */
    form.addEventListener('submit', (e) => {
        e.preventDefault();

        const email    = emailInput.value.trim();
        const password = passwordInput.value;

        // Validation email
        if (!email) {
            return showError('Veuillez saisir votre adresse email');
        }
        if (!validateEmail(email)) {
            return showError('Format d\'email invalide');
        }

        // Validation mot de passe
        if (!password) {
            return showError('Veuillez saisir votre mot de passe');
        }
        if (password.length < 4) {
            return showError('Le mot de passe doit contenir au moins 4 caractères');
        }

        // Simulation d'une connexion
        submitBtn.disabled = true;
        submitBtn.classList.add('loading');
        submitBtn.querySelector('.btn-text').textContent = 'Connexion...';

        // Simule une requête (1.2s)
        setTimeout(() => {
            // Stocke l'email en session (optionnel)
            sessionStorage.setItem('allsol_agent_email', email);
            if (document.getElementById('remember').checked) {
                localStorage.setItem('allsol_remember_email', email);
            }

            // Redirection vers le dashboard
            window.location.href = 'dashboard.html';
        }, 1200);
    });

    /* ============================================================
       AUTO-REMPLISSAGE (si "se souvenir")
       ============================================================ */
    const savedEmail = localStorage.getItem('allsol_remember_email');
    if (savedEmail) {
        emailInput.value = savedEmail;
        passwordInput.focus();
    }

    /* ============================================================
       EFFACER L'ERREUR EN TAPANT
       ============================================================ */
    [emailInput, passwordInput].forEach(input => {
        input.addEventListener('input', () => {
            errorBanner.classList.remove('show');
        });
    });
</script>

</body>
</html>
